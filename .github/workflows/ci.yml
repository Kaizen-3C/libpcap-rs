name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release

  differential:
    name: differential vs upstream C (built from libpcap tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: regenerate goldens from upstream and byte-compare
        run: bash scripts/regen_goldens.sh

  fuzz-smoke:
    name: differential fuzz smoke (60s, cheap CI gate — see FUZZING.md for deep runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: populate the pinned libpcap tarball (build.rs needs cref/_build/libpcap-1.10.5)
        run: bash scripts/regen_goldens.sh
      - name: seed the corpora from the curated envelopes
        run: python3 fuzz/seed_corpus.py
      - name: fuzz classic-pcap for 60s — any crash or C/Rust divergence fails the job
        run: cargo +nightly fuzz run differential -- -max_total_time=60 fuzz/corpus/differential
      - name: fuzz pcapng for 60s — any crash or C/Rust divergence fails the job
        run: cargo +nightly fuzz run differential_pcapng -- -max_total_time=60 -max_len=65536 fuzz/corpus/differential_pcapng

  bigendian:
    name: big-endian differential (verbatim C vs Rust, both on s390x under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: s390x-unknown-linux-gnu
      - name: install s390x cross-toolchain + qemu-user + clang (for regen)
        run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu qemu-user-static clang
      - name: assemble the verbatim-C references from the pinned tarball
        run: bash scripts/regen_goldens.sh
      # A TRUE on-host differential: build the verbatim C AND the Rust port for s390x and compare
      # their live outputs under qemu. Unlike comparing to an x86-made golden, this actually
      # exercises the big-endian reading-host path — the host-relative post_process swap (#1702).
      - name: verbatim C vs Rust port, both running on big-endian s390x
        run: bash scripts/bigendian_diff.sh
