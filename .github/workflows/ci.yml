name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release

  differential:
    name: differential vs upstream C (built from libpcap tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: regenerate goldens from upstream and byte-compare
        run: bash scripts/regen_goldens.sh

  fuzz-smoke:
    name: differential fuzz smoke (60s, cheap CI gate — see FUZZING.md for deep runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: populate the pinned libpcap tarball (build.rs needs cref/_build/libpcap-1.10.5)
        run: bash scripts/regen_goldens.sh
      - name: seed the corpora from the curated envelopes
        run: python3 fuzz/seed_corpus.py
      - name: fuzz classic-pcap for 60s — any crash or C/Rust divergence fails the job
        run: cargo +nightly fuzz run differential -- -max_total_time=60 fuzz/corpus/differential
      - name: fuzz pcapng for 60s — any crash or C/Rust divergence fails the job
        run: cargo +nightly fuzz run differential_pcapng -- -max_total_time=60 -max_len=65536 fuzz/corpus/differential_pcapng

  bigendian:
    name: big-endian differential (s390x under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: s390x-unknown-linux-gnu
      - name: install s390x cross-linker + qemu-user
        run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu qemu-user-static
      - name: cross-build the differential drivers for s390x (64-bit big-endian)
        env:
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
        run: |
          cargo build --release --target s390x-unknown-linux-gnu --bin differential_driver
          cargo build --release --target s390x-unknown-linux-gnu --bin differential_driver_pcapng
      - name: replay the full envelopes under qemu-s390x and byte-compare to the C goldens
        run: |
          qemu-s390x-static -L /usr/s390x-linux-gnu \
            target/s390x-unknown-linux-gnu/release/differential_driver \
            < tests/vectors/pcap_inputs.txt | tr -d '\r' > be_out.txt
          diff <(tr -d '\r' < tests/vectors/pcap_golden.txt) be_out.txt
          echo "big-endian (s390x) output byte-identical to the C golden — all 217 pcap cases"
          qemu-s390x-static -L /usr/s390x-linux-gnu \
            target/s390x-unknown-linux-gnu/release/differential_driver_pcapng \
            < tests/vectors/pcapng_inputs.txt | tr -d '\r' > be_out_pcapng.txt
          diff <(tr -d '\r' < tests/vectors/pcapng_golden.txt) be_out_pcapng.txt
          echo "big-endian (s390x) output byte-identical to the C golden — all 226 pcapng cases"
